```xml
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 500 500"
    width="500"
    height="500">

    <!-- ========================= -->
    <!-- COMPASS CIRCLE             -->
    <!-- ========================= -->

    <circle
        cx="250"
        cy="250"
        r="220"
        fill="none"
        stroke="#22d3ee"
        stroke-width="3"/>


    <circle
        cx="250"
        cy="250"
        r="205"
        fill="none"
        stroke="#22d3ee"
        stroke-width="1"
        opacity="0.5"/>


    <!-- ========================= -->
    <!-- DEGREE MARKERS             -->
    <!-- ========================= -->

    <text
        x="250"
        y="45"
        text-anchor="middle"
        fill="#22d3ee"
        font-size="20">
        000
    </text>

    <text
        x="455"
        y="257"
        text-anchor="middle"
        fill="#22d3ee"
        font-size="20">
        090
    </text>

    <text
        x="250"
        y="465"
        text-anchor="middle"
        fill="#22d3ee"
        font-size="20">
        180
    </text>

    <text
        x="45"
        y="257"
        text-anchor="middle"
        fill="#22d3ee"
        font-size="20">
        270
    </text>


    <!-- ========================= -->
    <!-- CARDINAL DIRECTIONS        -->
    <!-- ========================= -->

    <text
        x="250"
        y="90"
        text-anchor="middle"
        fill="#ffffff"
        font-size="34"
        font-weight="bold">
        N
    </text>

    <text
        x="410"
        y="262"
        text-anchor="middle"
        fill="#ffffff"
        font-size="34"
        font-weight="bold">
        E
    </text>

    <text
        x="250"
        y="425"
        text-anchor="middle"
        fill="#ffffff"
        font-size="34"
        font-weight="bold">
        S
    </text>

    <text
        x="90"
        y="262"
        text-anchor="middle"
        fill="#ffffff"
        font-size="34"
        font-weight="bold">
        W
    </text>


    <!-- ========================= -->
    <!-- COMPASS NEEDLE             -->
    <!-- ========================= -->

    <g
        id="needle"
        transform="rotate(0 250 250)">

        <!-- North / red section -->

        <polygon
            points="250,80 235,250 250,230 265,250"
            fill="#ef4444"/>

        <!-- South / cyan section -->

        <polygon
            points="250,420 235,250 250,270 265,250"
            fill="#22d3ee"/>

    </g>


    <!-- ========================= -->
    <!-- CENTER                    -->
    <!-- ========================= -->

    <circle
        cx="250"
        cy="250"
        r="12"
        fill="#0f172a"
        stroke="#22d3ee"
        stroke-width="3"/>

    <circle
        cx="250"
        cy="250"
        r="4"
        fill="#22d3ee"/>

</svg>
```
