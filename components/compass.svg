<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Fondo -->
  <circle cx="300" cy="300" r="280" fill="black" stroke="#FFD700" stroke-width="6"/>

  <!-- Estrella islámica de 8 puntas -->
  <polygon points="300,40 370,200 560,200 420,320 470,520 300,400 130,520 180,320 40,200 230,200"
           fill="#0A3D62" stroke="#FFD700" stroke-width="4"/>

  <!-- Anillo decorativo -->
  <circle cx="300" cy="300" r="220" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="14,7"/>

  <!-- Direcciones cardinales -->
  <text x="300" y="60" fill="#00aaff" font-family="Press Start 2P" font-size="22" text-anchor="middle">N</text>
  <text x="300" y="580" fill="#00aaff" font-family="Press Start 2P" font-size="22" text-anchor="middle">S</text>
  <text x="60" y="310" fill="#00aaff" font-family="Press Start 2P" font-size="22" text-anchor="middle">W</text>
  <text x="540" y="310" fill="#00aaff" font-family="Press Start 2P" font-size="22" text-anchor="middle">E</text>

  <!-- Aguja -->
  <rect id="needle" x="298" y="120" width="4" height="180" fill="red" transform="rotate(0,300,300)"/>
</svg>
