<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyCortex Compass</title>
    
    <link rel="icon" type="image/jpeg" href="Compass.jpg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <h1>SKYCORTEX COMPASS</h1>

    <div class="compass">

        <object 
            type="image/svg+xml"
            data="components/compass.svg">
        </object>

    </div>


   <div class="data-panel">

    <div>
        <span>HEADING</span>
        <strong id="degrees">000°</strong>
    </div>


    <div>
        <span>GPS STATUS</span>
        <strong id="gpsStatus">OFFLINE</strong>
    </div>


    <div>
        <span>LATITUDE</span>
        <strong id="latitude">--</strong>
    </div>


    <div>
        <span>LONGITUDE</span>
        <strong id="longitude">--</strong>
    </div>


    <div>
        <span>ALTITUDE</span>
        <strong id="altitude">--</strong>
    </div>


    <div>
        <span>ACCURACY</span>
        <strong id="accuracy">--</strong>
    </div>


</div>

<script src="script.js"></script>

</body>

</html>
