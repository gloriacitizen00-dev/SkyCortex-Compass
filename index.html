<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyCortex Compass</title>
    
    <link rel="icon" type="image/jpeg" href="Compass.jpg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <h1>SKYCORTEX COMPASS</h1>

    <div class="compass">

        <object 
            type="image/svg+xml"
            data="components/compass.svg">
        </object>

    </div>


   <div class="data-panel">

    <div>
        <span>HEADING</span>
        <strong id="degrees">000°</strong>
    </div>

    <div>
    <span>DIRECTION</span>
    <strong id="direction">--</strong>
</div>


    <div>
        <span>GPS STATUS</span>
        <strong id="gpsStatus">OFFLINE</strong>
    </div>


    <div>
        <span>LATITUDE</span>
        <strong id="latitude">--</strong>
    </div>


    <div>
        <span>LONGITUDE</span>
        <strong id="longitude">--</strong>
    </div>


    <div>
        <span>ALTITUDE</span>
        <strong id="altitude">--</strong>
    </div>


    <div>
        <span>ACCURACY</span>
        <strong id="accuracy">--</strong>
    </div>

    <div>
        <span>MOON</span>
        <strong id="moon">--</strong>
    </div>


    <div>
        <span>SUN</span>
        <strong id="sun">--</strong>
    </div>

    <div>
    <span>SUNRISE</span>
    <strong id="sunrise">--</strong>
</div>


<div>
    <span>SUNSET</span>
    <strong id="sunset">--</strong>
</div>


<div>
    <span>SOLAR ALTITUDE</span>
    <strong id="solarAltitude">--</strong>
</div>


    <div>
        <span>SOLAR TIME</span>
        <strong id="solarTime">--</strong>
    </div>



</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>  
<script src="https://unpkg.com/suncalc"></script>
<script type="module" src="script.js"></script>

</body>

</html>
