<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brújula Mística</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="compass-container">
    <img src="compass.jpg" alt="Rosa de los vientos" class="compass-base">
    <div id="needle"></div>
  </div>

  <div class="control-panel">
    <p id="direction">Dirección: --</p>
    <p id="latitude">Latitud: --</p>
    <p id="longitude">Longitud: --</p>
    <p id="altitude">Altitud: --</p>
    <p id="moon">Luna: --</p>
    <p id="sun">Sol: --</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
