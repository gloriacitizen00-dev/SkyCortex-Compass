<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCortex Compass</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <h1>SkyCortex Compass</h1>

        <div class="compass">

<svg id="compassSVG" width="450" height="450" viewBox="0 0 450 450">

    <!-- Círculo exterior -->
    <circle
        cx="225"
        cy="225"
        r="205"
        fill="#16202b"
        stroke="#9aa4b2"
        stroke-width="8"/>

    <!-- Marcas cardinales -->
    <text x="225" y="45" text-anchor="middle" fill="white" font-size="34">N</text>
    <text x="405" y="235" text-anchor="middle" fill="white" font-size="34">E</text>
    <text x="225" y="425" text-anchor="middle" fill="white" font-size="34">S</text>
    <text x="45" y="235" text-anchor="middle" fill="white" font-size="34">W</text>

    <!-- Aguja -->
    <g id="needle">

        <polygon
            points="225,70 215,225 235,225"
            fill="#ff3b30"/>

        <polygon
            points="225,380 215,225 235,225"
            fill="white"/>

        <circle
            cx="225"
            cy="225"
            r="10"
            fill="gold"
            stroke="white"
            stroke-width="3"/>

    </g>

</svg>

</div>

        <h2 id="degrees">0°</h2>

    </div>

<script src="script.js"></script>

</body>
</html>
